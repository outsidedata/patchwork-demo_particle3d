<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>demo_particle3d dev</title>
    <style>
      body { margin: 0; background: #0b0b0e; display: grid; place-items: center; height: 100vh }
      canvas { grid-area: 1 / 1 }
      .lil-gui.root { max-height: 100vh; overflow-y: auto }
    </style>
  </head>
  <body>
    <script type="module">
      // The demo of particle3d: index.html, the manager truth and the scenes its row names all in this
      // tab, one seat on them over a loopback, stepped on the page's clock, and a panel holding every
      // number of `world.particle3d`, the effects file's own numbers, and the render3d settings that
      // change how the particles look or what they cost. `?scene=<scene>` enters that scene. The truths
      // are kept on `window.__scenes` and the page on `window.__page` for the profilers
      // (benchmarking-a-game). The frame rate is three's stats panel, the stats plugin, at the top left.
      //
      // The keys are the game's own (`player.client.ts`), and none of them takes the pointer, so the
      // panel is clicked freely: W and S fly forward and back, A and D turn, Q and E tilt up and down,
      // Space climbs, C sinks, Shift boosts, the right mouse button dragged looks, the wheel, turned
      // anywhere but over the panel, paces, and 1 to 8 fire the effects.
      //
      // The panel tweaks a copy of the scene's `world.particle3d`, laid into the truth's world and the
      // page's a quarter second after the last change, so the server's ledger and the page read the
      // same `hold`; a change to a number the plugin reads only on its first frame (FIRST) closes the
      // page's plugin so the next frame builds it again. The effects file's `cap`, `alphaTest` and `ppm`
      // are written into the page's own decoded copy of the file, which particle3d reads every frame.
      // Nothing is written to disk: `copy world.particle3d JSON` and `copy effects file numbers JSON`
      // copy the panel's numbers, for the scene file and the top of the effects file, and `reset to the
      // file` puts the files' back.
      //
      // The render3d folder: the pixel ratio, drawn smooth or as blocks; the exposure and the tone
      // mapping; the AO's and the bloom's numbers, on their passes as they draw. The AO and the bloom
      // on or off load the page again with `?ao=` and `?bloom=`, since the renderer's reversed depth and
      // its composer are fixed when it is made.
      import { boot } from '#engine/engine.ts'
      import { accept, load, manager, link, view } from '#addons/scenemanager/scenemanager.addon.ts'
      import { loopback } from '#addons/loopback/loopback.addon.ts'
      import { prepared } from '#plugins/loader/loader.sim.ts'
      import GUI from 'lil-gui'
      import { sim } from './demo_particle3d.sim.ts'
      import { scene as main } from './main.sim.ts'
      import file from './demo_particle3d.scene.json'

      const clone = v => JSON.parse(JSON.stringify(v))
      const params = new URLSearchParams(location.search)
      file.prefabs.scenemanager.entry = params.get('scene') ?? file.prefabs.scenemanager.entry
      // The AO and the bloom, on or off from the address, before the renderer is made.
      const r3 = main.prefabs.render3d
      const fileBloom = clone(r3.bloom)
      if (params.has('ao')) r3.ao.on = params.get('ao') === '1'
      if (params.get('bloom') === '0') delete r3.bloom
      // The file's numbers, as they were, for `reset to the file`.
      const fileOwn = clone(main.world.particle3d)

      const dt = file.prefabs.engine.dt
      const truth = boot(file, sim)
      window.__scenes = await load(truth, import.meta.url)
      let client
      const page = view(link(loopback(accept(manager(truth)))), file, import.meta.url, (me, scene) => {
        client = me
        for (const surface of [me.plugins.render3d ?? me.plugins.render2d, me.plugins.ui]) {
          if (!surface) continue
          const canvas = document.createElement('canvas')
          canvas.width = scene.prefabs.engine.width
          canvas.height = scene.prefabs.engine.height
          document.body.appendChild(canvas)
          surface.mount(canvas)
        }
        me.plugins.stats?.mount(document.body)
      })
      window.__page = page
      // The truth of the scene the seat is on.
      const room = () => window.__scenes.get(chosen.scene)

      // The panel: the scene, chosen from the manager's table, the page loaded again on it. Keys typed
      // into it and the wheel turned over it reach neither this page nor the craft, so the wheel scrolls
      // the panel.
      const gui = new GUI({ title: 'demo_particle3d dev' })
      for (const type of ['keydown', 'keyup', 'wheel']) gui.domElement.addEventListener(type, e => e.stopPropagation())
      const chosen = { scene: file.prefabs.scenemanager.entry }
      const reload = (key, value) => {
        const url = new URL(location.href)
        url.searchParams.set(key, value)
        location.href = url.href
      }
      gui.add(chosen, 'scene', Object.keys(file.prefabs.scenemanager.scenes)).onChange(s => reload('scene', s))

      // ---------- particle3d ----------

      // The panel's copy of world.particle3d.
      const own = clone(fileOwn)
      // The numbers the plugin reads only on its first frame, from its header: the effects file's name.
      const FIRST = ['effects']
      let built = JSON.stringify(FIRST.map(k => own[k]))
      // The panel's copy laid into the truth's world and the page's a quarter second after the last
      // change, and the page's plugin closed when a first-frame number changed, so it is built again.
      let timer
      const apply = () => {
        clearTimeout(timer)
        timer = setTimeout(() => {
          for (const world of [room()?.world, client?.plugins.wire.scene.world]) if (world) Object.assign(world.particle3d, clone(own))
          const first = JSON.stringify(FIRST.map(k => own[k]))
          if (first !== built) {
            built = first
            client?.plugins.particle3d.close()
          }
        }, 250)
      }
      // The effects file's own numbers, as the tab's one decoded copy of it gives them (the page's
      // client decodes a copy of its own, which the panel writes and this one is not), and the panel's
      // copy of them, written
      // into the page's decoded copy of the file a quarter second after the last change.
      const fileEffects = await prepared(main.world, own.effects)
      const fileTop = { cap: fileEffects.cap, alphaTest: fileEffects.alphaTest ?? 0, ppm: fileEffects.ppm }
      const top = clone(fileTop)
      let topTimer
      const applyTop = () => {
        clearTimeout(topTimer)
        topTimer = setTimeout(() => {
          const effects = client?.plugins.loader.get(own.effects)
          if (effects) Object.assign(effects, top)
        }, 250)
      }

      const pf = gui.addFolder('particle3d')
      pf.add(own, 'hold', 0, 2, 0.01).name('hold s').onChange(apply)
      pf.add(top, 'cap', 100, 20000, 100).name('cap particles').onChange(applyTop)
      pf.add(top, 'alphaTest', 0, 1, 0.01).name('alphaTest').onChange(applyTop)
      pf.add(top, 'ppm', 8, 256, 1).name('ppm px/m').onChange(applyTop)

      gui.add({ copy: () => navigator.clipboard?.writeText(JSON.stringify(own, null, 2)) }, 'copy').name('copy world.particle3d JSON')
      gui.add({ copy: () => navigator.clipboard?.writeText(JSON.stringify(top, null, 2)) }, 'copy').name('copy effects file numbers JSON')
      // The files' numbers written into the panel's copies, key by key, so every control keeps its object.
      const into = (to, from) => {
        for (const [k, v] of Object.entries(from)) {
          if (v && typeof v === 'object') into(to[k], v)
          else to[k] = v
        }
      }
      gui.add({ reset: () => {
        into(own, fileOwn)
        into(top, fileTop)
        for (const c of gui.controllersRecursive()) c.updateDisplay()
        apply()
        applyTop()
      } }, 'reset').name('reset to the file')

      // ---------- render3d ----------

      const rf = gui.addFolder('render3d')
      const r3d = () => client?.plugins.render3d
      const look = { ratio: r3.pixelRatio ?? 1, blocks: false, exposure: r3.exposure ?? 1, tone: r3.tone ?? 'none' }
      const ratio = () => r3d()?.ratio(look.ratio, look.blocks ? 'blocks' : 'smooth')
      rf.add(look, 'ratio', 0.1, 3, 0.05).name('pixel ratio').onChange(ratio)
      rf.add(look, 'blocks').name('pixels as blocks').onChange(ratio)
      rf.add(look, 'exposure', 0, 4, 0.01).onChange(v => {
        const renderer = r3d()?.renderer
        if (renderer) renderer.toneMappingExposure = v
      })
      rf.add(look, 'tone', ['neutral', 'none']).name('tone mapping').onChange(v => {
        const three = r3d()?.THREE, renderer = r3d()?.renderer
        if (renderer) renderer.toneMapping = v === 'neutral' ? three.NeutralToneMapping : three.NoToneMapping
      })
      // The passes of the composer as it draws: the AO's and the bloom's.
      const passOf = has => r3d()?.composer?.passes.find(has)
      const ao = clone(r3.ao)
      const af = rf.addFolder('ao')
      af.add({ on: !!r3.ao.on }, 'on').onChange(v => reload('ao', v ? '1' : '0'))
      const setAo = () => {
        Object.assign(client.plugins.wire.scene.prefabs.render3d.ao, ao)
        const gtao = passOf(p => 'updateGtaoMaterial' in p)
        if (!gtao) return
        gtao.updateGtaoMaterial({ radius: ao.radius, thickness: ao.thickness, distanceFallOff: ao.falloff, scale: ao.scale, samples: ao.samples })
        gtao.blendIntensity = ao.intensity
      }
      af.add(ao, 'radius', 0.01, 10, 0.01).onChange(setAo)
      af.add(ao, 'thickness', 0.01, 5, 0.01).onChange(setAo)
      af.add(ao, 'falloff', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'scale', 0, 5, 0.01).onChange(setAo)
      af.add(ao, 'intensity', 0, 2, 0.01).onChange(setAo)
      af.add(ao, 'samples', 2, 32, 1).onChange(setAo)
      af.close()
      const bloom = clone(fileBloom)
      const bf = rf.addFolder('bloom')
      bf.add({ on: !!r3.bloom }, 'on').onChange(v => reload('bloom', v ? '1' : '0'))
      const setBloom = () => {
        const prefab = client.plugins.wire.scene.prefabs.render3d
        if (prefab.bloom) Object.assign(prefab.bloom, bloom)
        const pass = passOf(p => 'strength' in p && 'threshold' in p)
        if (!pass) return
        pass.strength = bloom.strength
        pass.radius = bloom.radius
        pass.threshold = bloom.threshold
      }
      bf.add(bloom, 'strength', 0, 3, 0.01).onChange(setBloom)
      bf.add(bloom, 'radius', 0, 1, 0.01).onChange(setBloom)
      bf.add(bloom, 'threshold', 0, 10, 0.05).onChange(setBloom)
      rf.close()

      let last = performance.now(), owed = 0
      const loop = async now => {
        owed += Math.min((now - last) / 1000, 0.25)
        last = now
        // A frame that throws is logged, and the next frame goes on.
        try {
          page.input()
          while (owed >= dt) { truth.step(dt); owed -= dt }
          await page.frame(owed / dt)
        } catch (e) { console.error(e) }
        requestAnimationFrame(loop)
      }
      requestAnimationFrame(loop)
    </script>
  </body>
</html>
